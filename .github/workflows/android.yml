name: Android build and verification
on:
  push:
    branches: ["codex/perioperative-planner"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and assemble
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Perioperative-Planner-Android
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-verification-reports
          path: |
            app/build/reports/
            app/build/test-results/
